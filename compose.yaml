services:
  workbench:
    build: .
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - agent_data:/data
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  agent_data:
