<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>栖云 · Agent 工作台</title><link rel="stylesheet" href="/style.css"></head>
<body><aside class="sidebar"><a class="brand" href="/">◈ <span>栖云 <small>WORKSPACE</small></span></a><button id="new" class="primary">＋ 新建工作</button><div class="section-label">我的工作 <span id="count">0</span></div><nav id="sessions"></nav><footer><span class="dot"></span> 单用户工作空间<div id="model">正在连接服务…</div></footer></aside>
<main><header><div><span class="eyebrow">云端 AGENT 助手</span><h1 id="title">让想法，在这里继续。</h1></div><div class="header-actions"><span id="status" class="badge">准备就绪</span><button id="rename" class="quiet">重命名</button></div></header><div id="notice" role="status" hidden></div>
<div class="workspace"><section class="conversation"><div id="welcome"><div class="hero-icon">✳</div><h2>从一件想完成的事开始</h2><p>写代码、读材料、整理报告。<br>交给助手执行，随时回来接着做。</p><div class="suggestions"><button data-prompt="开发一个无需依赖的 Python CSV 汇总工具，支持按分类计算金额总和。将源码、测试和使用说明保存到 artifacts/，并运行测试。"><span>⌘</span><strong>开发一个小工具</strong><small>从想法到代码，带上验证结果 ↗</small></button><button data-prompt="请分析 uploads/ 中的销售材料，核对汇总数据，整理趋势、问题和建议，把 Markdown 报告写入 artifacts/。缺失信息请明确标注。"><span>▤</span><strong>分析工作材料</strong><small>先上传文件，再让助手整理 ↗</small></button></div><div class="hint">每项工作都有独立的会话、材料与成果</div></div><div id="messages" aria-live="polite"></div><div class="composer"><div id="attachment-note"></div><textarea id="prompt" placeholder="描述任务，或提出下一步修改意见…" aria-label="任务内容"></textarea><div class="compose-actions"><label class="upload-button" for="upload">＋ 上传材料</label><input id="upload" type="file" multiple hidden><span>Ctrl / ⌘ + Enter 发送</span><button id="stop" class="danger" hidden>停止任务</button><button id="send" class="primary">开始执行 ↑</button></div></div><div class="composer-note">任务在后台执行 · 关闭页面后，可回来继续</div></section>
<aside class="inspector"><div class="tabs"><button id="files-tab" class="active">文件与成果</button><button id="logs-tab">执行记录</button></div><section id="file-panel"><div class="panel-head"><span>工作区文件</span><a id="archive" href="#">全部下载 ↓</a></div><div id="files"><div class="empty">▧<p>成果会出现在这里</p><small>上传的材料和助手生成的文件<br>都保存在当前工作区</small></div></div></section><section id="log-panel" hidden><div class="panel-head">执行过程 <span>实时更新</span></div><div id="logs"></div></section><div class="inspector-foot">◷ 历史记录自动保存</div></aside></div></main>
<dialog id="preview"><div class="preview-head"><strong id="preview-name"></strong><button id="close-preview">关闭 ×</button></div><pre id="preview-text"></pre></dialog><script src="/app.js"></script></body></html>
