name: Verify application and Docker
on: [push, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: docker build -t cloud-agent-workbench .
      - name: Start real container and verify persistence
        run: |
          docker volume create smoke-data
          docker run -d --name workbench -p 127.0.0.1:8000:8000 -v smoke-data:/data cloud-agent-workbench
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && break || sleep 2; done
          docker exec workbench codex --version
          curl -fsS http://127.0.0.1:8000/ > /tmp/index.html
          grep -q '栖云' /tmp/index.html
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{"title":"Docker persistence proof"}' http://127.0.0.1:8000/api/sessions > /tmp/session.json
          docker restart workbench
          sleep 5
          python - <<'PY'
          import json, urllib.request
          sid=json.load(open('/tmp/session.json'))['id']
          result=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/sessions/'+sid))
          assert result['session']['title']=='Docker persistence proof'
          print('PASS: container HTTP, CLI binary, SQLite volume persistence across restart')
          PY
      - name: Container logs
        if: always()
        run: docker logs workbench || true
